<title>Troia: Ödeme</title>
<meta name="description" content="Troia hosted checkout: Troy kartıyla TL öde, satıcı Arc'ta USDC alır.">
<style>
  :root{
    color-scheme:dark;
    --navy:#0C1B30;--navy2:#12233D;--navyline:#22406C;
    --ivory:#F4EFE4;--ink:#0C1B30;--inkmut:#42536E;--paperline:rgba(12,27,48,.15);--paperline2:rgba(12,27,48,.28);
    --onnavy:#EFE9DC;--onnavymut:#9FB1CB;--brass:#B08A50;--brass2:#C7A468;
    --serif:"Hoefler Text","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--navy);color:var(--onnavy);font-family:var(--sans);-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 18px;position:relative;overflow-x:hidden}
  .arcbg{position:fixed;left:-140px;bottom:-160px;width:620px;height:620px;opacity:.06;pointer-events:none;z-index:0}
  .arcbg svg{width:100%;height:100%}
  .brandbar{display:flex;align-items:center;gap:12px;margin-bottom:26px;z-index:1}
  .brandbar .mk{width:38px;height:38px}
  .brandbar b{font-family:var(--serif);font-size:1.5rem;letter-spacing:.16em;font-weight:500}
  .brandbar small{display:block;font-size:.54rem;letter-spacing:.26em;text-transform:uppercase;color:var(--onnavymut);margin-top:4px}

  .card{width:100%;max-width:430px;background:var(--ivory);color:var(--ink);border-top:2px solid var(--brass);
    box-shadow:0 40px 90px -30px rgba(0,0,0,.7);z-index:1}
  .card .top{padding:20px 24px;border-bottom:1px solid var(--paperline);display:flex;align-items:center;justify-content:space-between}
  .card .top .mrch{display:flex;align-items:center;gap:12px}
  .card .top .ava{width:38px;height:38px;background:var(--navy);color:var(--ivory);display:grid;place-items:center;font-family:var(--serif);font-size:.95rem}
  .card .top .nm{font-family:var(--serif);font-size:1.05rem}
  .card .top .ord{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--inkmut);margin-top:2px}
  .card .top .vf{font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);border:1px solid var(--brass);padding:5px 8px}

  .amt{padding:26px 24px 22px;text-align:center;border-bottom:1px solid var(--paperline)}
  .amt .l{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--inkmut)}
  .amt .v{font-family:var(--serif);font-size:2.6rem;font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:6px}

  form{padding:22px 24px 8px}
  .fld{margin-bottom:16px}
  .fld label{display:block;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--inkmut);margin-bottom:7px}
  .fld input{width:100%;background:#fff;border:1px solid var(--paperline2);color:var(--ink);font-family:var(--sans);
    font-size:.98rem;padding:12px 13px;letter-spacing:.02em}
  .fld input::placeholder{color:#A9A290}
  .fld input:focus{outline:none;border-color:var(--brass)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .brand-row{display:flex;align-items:center;justify-content:space-between;margin:2px 0 18px;font-size:.7rem;color:var(--inkmut)}
  .brand-row .troy{font-family:var(--serif);letter-spacing:.14em;color:var(--ink);font-weight:600}

  .pay{width:100%;border:none;cursor:pointer;background:var(--navy);color:var(--ivory);font-family:var(--sans);
    font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.86rem;padding:17px;border-top:2px solid var(--brass);
    display:flex;align-items:center;justify-content:center;gap:10px;transition:background .14s}
  .pay:hover{background:#0A1728}
  .pay .amtx{font-family:var(--serif);letter-spacing:0;text-transform:none;font-size:1rem}

  .foot{padding:14px 24px 20px;text-align:center;font-size:.68rem;color:var(--inkmut);letter-spacing:.02em}
  .foot svg{vertical-align:-2px;margin-right:5px;color:var(--brass)}

  .settle{margin-top:22px;z-index:1;display:flex;align-items:center;gap:10px;color:var(--onnavymut);font-size:.72rem;letter-spacing:.04em}
  .settle .ln{width:26px;height:1px;background:var(--brass)}
  .settle b{color:var(--onnavy);font-weight:600}
</style>
