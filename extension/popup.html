<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  :root{
    --navy:#0C1B30;--surf:#F4EFE4;--ink:#0C1B30;--inkmut:#42536E;
    --paperline:rgba(12,27,48,.15);--paperline2:rgba(12,27,48,.28);
    --brass:#B08A50;--brass2:#C7A468;
    --serif:"Hoefler Text","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{width:380px;background:var(--surf);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .card{border-top:2px solid var(--brass)}
  .head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid var(--paperline)}
  .logo{display:flex;align-items:center;gap:11px}
  .logo .mk{width:34px;height:34px;flex:none}
  .logo b{font-family:var(--serif);font-size:1.05rem;letter-spacing:.14em;font-weight:500;line-height:1}
  .logo .arc{font-size:.54rem;letter-spacing:.24em;text-transform:uppercase;color:var(--inkmut);display:block;margin-top:4px}
  .status{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);border:1px solid var(--brass);padding:5px 9px;font-weight:600}

  .mrch{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--paperline)}
  .mrch .ava{width:34px;height:34px;background:var(--navy);color:var(--surf);display:grid;place-items:center;font-family:var(--serif);font-size:.85rem}
  .mrch .nm{font-family:var(--serif);font-weight:500;font-size:.98rem}
  .mrch .ord{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--inkmut);margin-top:2px}

  .hero{padding:16px 16px 6px}
  .nets2{text-align:center;font-size:.68rem;letter-spacing:.04em;color:var(--inkmut);margin-top:14px}
  .leg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 14px;border:1px solid var(--paperline)}
  .leg .amt{font-family:var(--serif);font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums}
  .leg.out .u{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);margin-left:6px}
  .chip{display:inline-flex;align-items:center;gap:8px;font-size:.72rem;font-weight:600;padding:7px 11px;border:1px solid var(--paperline2)}
  .chip .c{font-family:var(--serif);font-weight:600}
  .bridge{display:flex;align-items:center;gap:12px;padding:8px 2px}
  .bridge .ln{flex:1;height:1px;background:var(--paperline2)}
  .bridge .lbl{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--brass)}

  .cta{margin:14px 16px 8px;width:calc(100% - 32px);border:none;cursor:pointer;background:var(--navy);color:var(--surf);
    font-family:var(--sans);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;padding:15px;border-top:2px solid var(--brass)}
  .cta:hover{background:#0A1728}
  .cta[disabled]{opacity:.5;cursor:default}

  .steps{display:flex;padding:12px 16px 16px;border-top:1px solid var(--paperline)}
  .steps .s{flex:1;text-align:center;font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--inkmut);position:relative}
  .steps .s::before{content:"";position:absolute;top:-13px;left:50%;width:6px;height:6px;transform:translateX(-50%);background:#C9C0AC}
  .steps .s.on::before{background:var(--brass)}
  .steps .s.on{color:var(--ink)}

  .empty{padding:34px 20px;text-align:center;color:var(--inkmut);font-size:.9rem}
  .empty .mk{width:38px;height:38px;margin:0 auto 14px;display:block;opacity:.85}
  .hidden{display:none}
</style>
</head>
